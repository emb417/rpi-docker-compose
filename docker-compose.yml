x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "14"
    
services:
  # The Nginx Reverse Proxy Service
  nginx:
    image: emb417/rpi-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - rpi-network
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - metaforiq-next
      - mistandlore
      - planka
      - trilium
      - uptime-kuma
      - effin-money-web
      - effin-money-www
      - effin-money-api
    logging: *default-logging

  # The Certbot Service
  certbot:
    image: certbot/dns-cloudflare
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ./cloudflare:/etc/cloudflare
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging: *default-logging

  # The Node.js Discord Bot Service
  libowski-bot:
    image: emb417/libowski-bot:latest
    restart: unless-stopped
    env_file:
      - ./libowski-bot.env
    networks:
      - rpi-network
    volumes:
      - ./libowski-bot-data:/app/data
    logging: *default-logging

  # The Next.js App Service
  metaforiq-next:
    image: emb417/metaforiq-next:latest
    restart: unless-stopped
    env_file:
      - ./metaforiq-next.env
    networks:
      - rpi-network
    logging: *default-logging

  # The Planka Kanban Board Trello Clone
  planka:
    image: ghcr.io/plankanban/planka:latest
    restart: unless-stopped
    env_file:
      - ./planka.env
    depends_on:
      - planka-db
    networks:
      - rpi-network
    volumes:
      - ~/planka-data/data:/app/data

    logging: *default-logging

  planka-db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./planka-db.env
    networks:
      - rpi-network
    volumes:
      - ~/planka-data/db:/var/lib/postgresql/data
    logging: *default-logging

  # The Trilium personal knowledge management service
  trilium:
    image: triliumnext/trilium:latest
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ~/trilium-data:/home/node/trilium-data
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    logging: *default-logging

  # The Uptime Kuma Service
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ~/uptime-kuma-data:/app/data
    logging: *default-logging

  # The Mist+Lore Next.js App
  mistandlore:
    image: emb417/mistandlore:latest
    restart: unless-stopped
    networks:
      - rpi-network
    logging: *default-logging

  effin-money-db:
    image: mongo:8.2
    container_name: effin-money-db
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ~/effin-money-data/db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  effin-money-api:
    image: effin-money-api:latest
    container_name: effin-money-api
    restart: unless-stopped
    env_file:
      - ./effin-money-api.env
    environment:
      - MONGO_URI=mongodb://effin-money-db:27017/effin-money
    networks:
      - rpi-network
    depends_on:
      effin-money-db:
        condition: service_healthy
    logging: *default-logging

  effin-money-web:
    image: effin-money-web:latest
    container_name: effin-money-web
    restart: unless-stopped
    env_file:
      - ./effin-money-web.env
    networks:
      - rpi-network
    depends_on:
      - effin-money-api
    logging: *default-logging

  effin-money-www:
    image: effin-money-www:latest
    container_name: effin-money-www
    restart: unless-stopped
    networks:
      - rpi-network
    logging: *default-logging

# Define an external network for your services to communicate.
networks:
  rpi-network:
    external: true