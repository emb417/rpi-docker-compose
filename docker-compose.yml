x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "14"

services:
  # The Nginx Reverse Proxy Service
  nginx:
    image: emb417/rpi-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - rpi-network
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - metaforiq-next
      - mistandlore
      - planka
      - trilium
      - uptime-kuma
      - effin-money-web
      - effin-money-www
      - effin-money-api
    logging: *default-logging

  # The Certbot Service
  certbot:
    image: certbot/dns-cloudflare
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ./cloudflare:/etc/cloudflare
      - ./certbot/conf:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: "/bin/sh -c 'apk add --no-cache curl; trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging: *default-logging

  # The Node.js Discord Bot Service
  libowski-bot:
    image: emb417/libowski-bot:latest
    restart: unless-stopped
    env_file:
      - ./libowski-bot.env
    networks:
      - rpi-network
    volumes:
      - ./libowski-bot-data:/app/data
    logging: *default-logging

  # The Next.js App Service
  metaforiq-next:
    image: emb417/metaforiq-next:latest
    restart: unless-stopped
    env_file:
      - ./metaforiq-next.env
    networks:
      - rpi-network
    logging: *default-logging

  # The Uptime Kuma Service
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ~/uptime-kuma-data:/app/data
    logging: *default-logging

  # The Mist+Lore Next.js App
  mistandlore:
    image: emb417/mistandlore:latest
    restart: unless-stopped
    networks:
      - rpi-network
    environment:
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=G-0E9J2CSSNT
    logging: *default-logging

  effin-money-db:
    image: mongo:8.2
    container_name: effin-money-db
    pull_policy: never
    restart: unless-stopped
    networks:
      - rpi-network
    volumes:
      - ~/effin-money-data/db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  effin-money-api:
    image: effin-money-api:latest
    container_name: effin-money-api
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ./effin-money-api.env
    environment:
      - MONGO_URI=mongodb://effin-money-db:27017/effin-money
    networks:
      - rpi-network
    volumes:
      - ~/effin-money-data/fastembed-cache:/models
    depends_on:
      effin-money-db:
        condition: service_healthy
    logging: *default-logging

  effin-money-web:
    image: effin-money-web:latest
    container_name: effin-money-web
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ./effin-money-web.env
    networks:
      - rpi-network
    depends_on:
      - effin-money-api
    logging: *default-logging

  effin-money-www:
    image: effin-money-www:latest
    container_name: effin-money-www
    pull_policy: never
    restart: unless-stopped
    networks:
      - rpi-network
    logging: *default-logging

# Define an external network for your services to communicate.
networks:
  rpi-network:
    external: true
